<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milk Tracker 🥛</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #21253a;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #e8eaf6;
      --muted: #6b7280;
      --success: #34d399;
      --today: #4f8ef7;
      --entered: #a78bfa;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #21253a 100%);
      padding: 20px 16px 16px;
      border-bottom: 1px solid rgba(79,142,247,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .logo span { font-size: 1.6rem; }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: var(--accent); }

    #month-label {
      font-weight: 600;
      font-size: 1rem;
      min-width: 120px;
      text-align: center;
    }

    /* Price row */
    .price-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(79,142,247,0.2);
    }

    .price-row label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    .price-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      min-width: 0;
    }

    .price-row .currency { color: var(--muted); font-size: 0.95rem; }

    /* Calendar */
    .calendar-wrap { padding: 16px; }

    .weekday-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    .weekday-headers div {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-cell {
      background: var(--card);
      border-radius: 10px;
      padding: 6px 4px 8px;
      min-height: 68px;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-cell:not(.empty):hover {
      border-color: var(--accent);
      transform: scale(1.04);
      z-index: 2;
    }

    .day-cell.today {
      border-color: var(--today);
      background: rgba(79,142,247,0.12);
    }

    .day-cell.has-entry {
      border-color: var(--entered);
      background: rgba(167,139,250,0.1);
    }

    .day-num {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .day-cell.today .day-num {
      color: var(--today);
    }

    .day-litres {
      font-size: 1rem;
      font-weight: 700;
      color: var(--entered);
      line-height: 1;
    }

    .day-litres.zero { color: rgba(107,114,128,0.5); font-size: 0.75rem; font-weight: 400; }

    .litre-label {
      font-size: 0.58rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Summary bar */
    .summary-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #1a1d27 0%, #21253a 100%);
      border-top: 1px solid rgba(79,142,247,0.2);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100;
    }

    .stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stats .total-litres {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stats .total-litres span {
      color: var(--text);
      font-weight: 600;
    }

    .calc-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .calc-btn:active { transform: scale(0.97); opacity: 0.9; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(30px);
      transition: transform 0.25s;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-date {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .modal-input-wrap {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1.5px solid rgba(79,142,247,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      gap: 12px;
    }

    .modal-input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      min-width: 0;
    }

    .modal-input-wrap .unit { color: var(--muted); font-size: 0.9rem; }

    .quick-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-btn:hover { background: var(--accent); border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-save {
      flex: 2;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Result modal */
    .result-modal {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 28px 24px;
      width: calc(100% - 32px);
      max-width: 400px;
      transform: scale(0.9);
      transition: transform 0.25s;
      text-align: center;
    }

    .modal-overlay.active .result-modal {
      transform: scale(1);
    }

    .result-modal .emoji { font-size: 3rem; margin-bottom: 12px; }
    .result-modal h2 { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; font-weight: 400; }
    .result-modal .amount {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-modal .breakdown {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .btn-close {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 12px 32px;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="logo"><span>🥛</span> Milk Tracker</div>
    <div class="month-nav">
      <button class="nav-btn" id="prev-month">&#8592;</button>
      <div id="month-label">May 2025</div>
      <button class="nav-btn" id="next-month">&#8594;</button>
    </div>
  </div>
  <div class="price-row">
    <label>Price per litre</label>
    <span class="currency">₹</span>
    <input type="number" id="price-per-litre" value="70" min="1" inputmode="decimal" />
    <label style="margin-left:4px;font-size:0.75rem;color:var(--accent)">/ L</label>
  </div>
</div>

<!-- Calendar -->
<div class="calendar-wrap">
  <div class="weekday-headers">
    <div>Sun</div><div>Mon</div><div>Tue</div>
    <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>
</div>

<!-- Summary bar -->
<div class="summary-bar">
  <div class="stats">
    <div class="total-litres">Total: <span id="total-litres">0 L</span></div>
    <div class="total-litres" style="margin-top:2px">Days entered: <span id="days-entered">0</span></div>
  </div>
  <button class="calc-btn" id="calc-btn">🧾 Calculate Bill</button>
</div>

<!-- Day entry modal -->
<div class="modal-overlay" id="day-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Enter Litres</div>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-input-wrap">
      <input type="number" id="litre-input" inputmode="decimal" placeholder="0" min="0" step="0.5" />
      <span class="unit">Litres</span>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setLitres(0.5)">0.5 L</button>
      <button class="quick-btn" onclick="setLitres(1)">1 L</button>
      <button class="quick-btn" onclick="setLitres(1.5)">1.5 L</button>
      <button class="quick-btn" onclick="setLitres(2)">2 L</button>
      <button class="quick-btn" onclick="setLitres(0)">None</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- Result modal -->
<div class="modal-overlay" id="result-modal">
  <div class="result-modal">
    <div class="emoji">🧾</div>
    <h2>Amount Due to Milkman</h2>
    <div class="amount" id="result-amount">₹0</div>
    <div class="breakdown" id="result-breakdown"></div>
    <button class="btn-close" id="result-close">Close</button>
  </div>
</div>

<script>
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  let currentYear, currentMonth, selectedDay;
  // data: { "YYYY-M-D": litres }
  let data = JSON.parse(localStorage.getItem('milkData') || '{}');

  function storageKey(y, m, d) { return `${y}-${m}-${d}`; }

  function getPrice() {
    return parseFloat(document.getElementById('price-per-litre').value) || 0;
  }

  // Init to current month
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth(); // 0-indexed

  function renderCalendar() {
    document.getElementById('month-label').textContent =
      MONTHS[currentMonth] + ' ' + currentYear;

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    const todayD = now.getDate();
    const todayM = now.getMonth();
    const todayY = now.getFullYear();

    for (let d = 1; d <= daysInMonth; d++) {
      const key = storageKey(currentYear, currentMonth, d);
      const litres = data[key] !== undefined ? data[key] : null;
      const isToday = (d === todayD && currentMonth === todayM && currentYear === todayY);

      const cell = document.createElement('div');
      cell.className = 'day-cell' +
        (isToday ? ' today' : '') +
        (litres !== null && litres > 0 ? ' has-entry' : '');

      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div class="day-litres ${litres === null || litres === 0 ? 'zero' : ''}">
          ${litres !== null && litres > 0 ? litres : (litres === 0 ? '—' : '+')}
        </div>
        ${litres !== null && litres > 0 ? '<div class="litre-label">litres</div>' : ''}
      `;

      cell.addEventListener('click', () => openDayModal(d));
      grid.appendChild(cell);
    }

    updateSummary();
  }

  function updateSummary() {
    let total = 0, days = 0;
    for (let d = 1; d <= 31; d++) {
      const key = storageKey(currentYear, currentMonth, d);
      if (data[key] !== undefined && data[key] > 0) {
        total += data[key];
        days++;
      }
    }
    document.getElementById('total-litres').textContent = total.toFixed(1) + ' L';
    document.getElementById('days-entered').textContent = days;
  }

  function openDayModal(day) {
    selectedDay = day;
    const date = new Date(currentYear, currentMonth, day);
    const dayName = DAYS[date.getDay()];
    document.getElementById('modal-title').textContent = `${dayName}, ${day} ${MONTHS[currentMonth]}`;
    document.getElementById('modal-date').textContent = 'How many litres did you take?';
    const key = storageKey(currentYear, currentMonth, day);
    const existing = data[key] !== undefined ? data[key] : '';
    document.getElementById('litre-input').value = existing !== '' ? existing : '';
    document.getElementById('day-modal').classList.add('active');
    setTimeout(() => document.getElementById('litre-input').focus(), 300);
  }

  function setLitres(val) {
    document.getElementById('litre-input').value = val;
  }

  document.getElementById('modal-cancel').addEventListener('click', () => {
    document.getElementById('day-modal').classList.remove('active');
  });

  document.getElementById('modal-save').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('litre-input').value);
    if (!isNaN(val) && val >= 0) {
      data[storageKey(currentYear, currentMonth, selectedDay)] = val;
      localStorage.setItem('milkData', JSON.stringify(data));
    }
    document.getElementById('day-modal').classList.remove('active');
    renderCalendar();
  });

  // Calculate bill
  document.getElementById('calc-btn').addEventListener('click', () => {
    let total = 0, days = 0;
    for (let d = 1; d <= 31; d++) {
      const key = storageKey(currentYear, currentMonth, d);
      if (data[key] !== undefined && data[key] > 0) {
        total += data[key];
        days++;
      }
    }
    const price = getPrice();
    const amount = total * price;

    document.getElementById('result-amount').textContent = '₹' + amount.toFixed(2);
    document.getElementById('result-breakdown').innerHTML =
      `${MONTHS[currentMonth]} ${currentYear}<br>` +
      `<strong style="color:var(--text)">${total.toFixed(1)} L</strong> &times; ₹${price}/L<br>` +
      `Across <strong style="color:var(--text)">${days} days</strong>`;

    document.getElementById('result-modal').classList.add('active');
  });

  document.getElementById('result-close').addEventListener('click', () => {
    document.getElementById('result-modal').classList.remove('active');
  });

  // Close modals on overlay click
  document.getElementById('day-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
  document.getElementById('result-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  // Month navigation
  document.getElementById('prev-month').addEventListener('click', () => {
    if (currentMonth === 0) { currentMonth = 11; currentYear--; }
    else currentMonth--;
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    if (currentMonth === 11) { currentMonth = 0; currentYear++; }
    else currentMonth++;
    renderCalendar();
  });

  // Save price to localStorage
  document.getElementById('price-per-litre').addEventListener('change', () => {
    localStorage.setItem('milkPrice', getPrice());
  });
  const savedPrice = localStorage.getItem('milkPrice');
  if (savedPrice) document.getElementById('price-per-litre').value = savedPrice;

  // Enter key saves
  document.getElementById('litre-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('modal-save').click();
  });

  renderCalendar();
</script>
</body>
</html>
